<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashflow - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* BASE Y ESCRITORIO */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; background: #f4f7f6; flex-direction: row; }
        
        .sidebar { 
            width: 250px; 
            height: 100vh; 
            background: #2c3e50; 
            color: white; 
            padding: 20px; 
            position: fixed; 
            box-sizing: border-box;
            z-index: 100;
        }
        
        .main-content { 
            margin-left: 250px; 
            padding: 40px; 
            width: calc(100% - 250px); 
            box-sizing: border-box;
            transition: 0.3s;
        }

        .card-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-top: 30px; 
        }

        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s;
            border-bottom: 5px solid transparent;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-bottom: 5px solid #3498db; }
        .card:active { transform: scale(0.98); }

        .card h3 { margin: 15px 0 10px; color: #2c3e50; font-size: 1.4rem; }
        .card p { color: #7f8c8d; font-size: 0.95rem; margin: 0; }
        
        .admin-only { display: none; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; margin-top: 20px; border-radius: 8px; font-weight: bold; }

        /* DISEÑO PARA CELULAR (RESPONSIVE) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            
            .sidebar { 
                width: 100%; 
                height: auto; 
                position: relative; 
                padding: 15px;
                text-align: center;
            }

            .sidebar hr, .sidebar nav p { display: none; } /* Simplificar en móvil */
            .sidebar br { display: none; }

            .main-content { 
                margin-left: 0; 
                padding: 20px; 
                width: 100%; 
            }

            .card-container {
                grid-template-columns: 1fr; /* Una tarjeta por fila */
            }

            .card { padding: 40px 20px; } /* Más espacio para tocar */
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>CASHFLOW</h2>
        <p id="user-name">Cargando...</p>
        <hr>
        <nav>
            <p><strong>MENÚ</strong></p>
            <div onclick="location.href='dashboard.html'" style="cursor:pointer; padding: 10px 0;">🏠 Inicio</div>
            <div class="admin-only" id="menu-config" onclick="location.href='configuracion.html'" style="cursor:pointer; padding: 10px 0;">⚙️ Configuración</div>
        </nav>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="main-content">
        <h1 id="bienvenida">Panel de Control</h1>
        <p>Selecciona una acción para continuar:</p>

        <div class="card-container">
            <div class="card" onclick="location.href='seleccion_unidad.html'">
                <div style="font-size: 50px;">📝</div>
                <h3>Registrar Movimiento</h3>
                <p>Ingresos y Egresos por unidad</p>
            </div>

            <div class="card" onclick="location.href='saldos.html'">
                <div style="font-size: 50px;">📊</div>
                <h3>Saldos en Cajas</h3>
                <p>Vista consolidada de efectivo y bancos</p>
            </div>

            <div class="card admin-only" id="card-admin" onclick="location.href='configuracion.html'">
                <div style="font-size: 50px;">🛠️</div>
                <h3>Gestión de Usuarios</h3>
                <p>Niveles y Unidades de Negocio</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD6C1-nRkNM-B1WcP7NjUWQ1KiNilNVkRk",
            authDomain: "flujodecajasotomayorayala.firebaseapp.com",
            projectId: "flujodecajasotomayorayala",
            storageBucket: "flujodecajasotomayorayala.firebasestorage.app",
            messagingSenderId: "694232278404",
            appId: "1:694232278404:web:e85ac3438ce7bc3971a9d1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("usuarios").doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('user-name').innerText = data.nombre;
                        document.getElementById('bienvenida').innerText = "Bienvenido, " + (data.rol || "Usuario");

                        if (data.nivel >= 100) {
                            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                        }
                    } else {
                        window.location.href = "espera.html";
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function cerrarSesion() {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        }
    </script>
</body>
</html>
