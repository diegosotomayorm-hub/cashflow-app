<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cashflow - Registro de Movimientos</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: sans-serif; background-color: #f0f2f5; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2>Control de Caja - Casa Jardín</h2>
        <p id="user-info">Cargando usuario...</p>
        <hr>
        
        <form id="form-movimiento">
            <label>Tipo:</label><br>
            <select id="tipo" style="width: 100%; padding: 10px; margin-bottom: 15px;">
                <option value="Ingreso">Ingreso (+)</option>
                <option value="Egreso">Egreso (-)</option>
            </select><br>

            <label>Monto (Bs):</label><br>
            <input type="number" id="monto" placeholder="0.00" required style="width: 100%; padding: 10px; margin-bottom: 15px;"><br>

            <label>Concepto:</label><br>
            <input type="text" id="concepto" placeholder="Ej: Pago de personal" required style="width: 100%; padding: 10px; margin-bottom: 15px;"><br>

            <button type="submit" style="width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Registrar Movimiento
            </button>
        </form>
        
        <br>
        <button onclick="auth.signOut().then(() => window.location.href='login.html')" style="background: none; border: none; color: red; cursor: pointer;">Cerrar Sesión</button>
    </div>

    <script>
        // PEGA AQUÍ TU MISMA CONFIGURACIÓN DE FIREBASE (La de login.html)
        const firebaseConfig = {
            apiKey: "AIzaSyD6C1-nRkNM-B1WcP7NjUWQ1KiNilNVkRk",
            authDomain: "flujodecajasotomayorayala.firebaseapp.com",
            projectId: "flujodecajasotomayorayala",
            storageBucket: "flujodecajasotomayorayala.firebasestorage.app",
            messagingSenderId: "694232278404",
            appId: "1:694232278404:web:e85ac3438ce7bc3971a9d1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Verificar sesión y permisos
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("usuarios").doc(user.uid).get().then(doc => {
                    if (doc.exists && doc.data().rol === "Directorio") {
                        document.getElementById('user-info').innerText = "Bienvenido: " + doc.data().nombre + " (Directorio)";
                    } else {
                        window.location.href = "espera.html";
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // Lógica para guardar el movimiento
        document.getElementById('form-movimiento').onsubmit = (e) => {
            e.preventDefault();
            const mov = {
                tipo: document.getElementById('tipo').value,
                monto: parseFloat(document.getElementById('monto').value),
                concepto: document.getElementById('concepto').value,
                fecha: firebase.firestore.FieldValue.serverTimestamp(),
                usuario: auth.currentUser.email
            };

            db.collection("movimientos").add(mov).then(() => {
                alert("¡Movimiento registrado!");
                document.getElementById('form-movimiento').reset();
            });
        };
    </script>
</body>
</html>
